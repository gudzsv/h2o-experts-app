<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="AquaTrack - your personal assistant for tracking water intake. Our platform helps you monitor the amount of water you drink, receive personalized recommendations, and manage your body's hydration balance for a healthy lifestyle. Maintain optimal hydration levels and improve your well-being with AquaTrack."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f0eff4"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#12181c"
    />
    <script>
      // The saved theme (src/helpers/theme.js) before the first paint.
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
      } catch (error) {
        // Without storage the system theme is used.
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AquaTrack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
